services:
  db:
    image: postgres:16-alpine
    container_name: bookingmngr-db
    environment:
      POSTGRES_USER: bookingmngr
      POSTGRES_PASSWORD: bookingmngr
      POSTGRES_DB: bookingmngr
    ports:
      - "5432:5432"
    volumes:
      - bookingmngr-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookingmngr"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  bookingmngr-pgdata:
